<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Safe Appearance Layer reference visualization</title>
  <desc id="desc">Illustrative comparison of a default conversational AI interface, a themed reference client, and a host-controlled Appearance API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#432b6f"/>
      <stop offset="0.35" stop-color="#b5527c"/>
      <stop offset="0.7" stop-color="#e39a62"/>
      <stop offset="1" stop-color="#4a7ea8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" rx="34" fill="url(#bg)"/>
  <circle cx="1250" cy="95" r="150" fill="#7c3aed" opacity="0.08"/>
  <circle cx="170" cy="735" r="170" fill="#0ea5e9" opacity="0.06"/>

  <text x="72" y="92" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="42" font-weight="750">Safe Appearance Layer</text>
  <text x="72" y="132" fill="#a8b3c7" font-family="Inter, ui-sans-serif, system-ui" font-size="20">Personalization without handing themes control of the conversation interface.</text>
  <rect x="72" y="164" width="470" height="3" rx="2" fill="url(#accent)"/>

  <g transform="translate(72 214)">
    <rect width="390" height="474" rx="24" fill="#f7f7f5"/>
    <rect width="102" height="474" rx="24" fill="#ecece8"/>
    <rect x="102" width="288" height="474" rx="24" fill="#fafaf8"/>
    <circle cx="32" cy="34" r="10" fill="#c6c7c1"/>
    <rect x="52" y="27" width="35" height="13" rx="6" fill="#c6c7c1"/>
    <rect x="18" y="76" width="66" height="9" rx="5" fill="#d4d5d0"/>
    <rect x="18" y="98" width="54" height="9" rx="5" fill="#d4d5d0"/>
    <text x="126" y="42" fill="#71717a" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">DEFAULT HOST UI</text>
    <rect x="136" y="96" width="190" height="46" rx="15" fill="#ededeb"/>
    <rect x="157" y="111" width="146" height="7" rx="3.5" fill="#b8bbb5"/>
    <rect x="157" y="125" width="88" height="7" rx="3.5" fill="#c7c9c4"/>
    <rect x="126" y="174" width="218" height="112" rx="16" fill="#ffffff" stroke="#e4e4df"/>
    <rect x="146" y="194" width="167" height="7" rx="3.5" fill="#8e948c"/>
    <rect x="146" y="210" width="180" height="7" rx="3.5" fill="#b0b4ad"/>
    <rect x="146" y="226" width="154" height="7" rx="3.5" fill="#b0b4ad"/>
    <rect x="146" y="242" width="122" height="7" rx="3.5" fill="#b0b4ad"/>
    <rect x="126" y="397" width="232" height="46" rx="18" fill="#ffffff" stroke="#deded8"/>
    <text x="195" y="425" fill="#92968f" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Message…</text>
    <text x="24" y="448" fill="#8b8f88" font-family="Inter, ui-sans-serif, system-ui" font-size="11">No custom backdrop</text>
  </g>

  <g transform="translate(526 214)">
    <rect width="390" height="474" rx="24" fill="url(#art)"/>
    <path d="M0 334 C82 276 128 368 212 309 C270 268 318 247 390 267 L390 474 L0 474 Z" fill="#10233a" opacity="0.44"/>
    <circle cx="318" cy="84" r="54" fill="#ffd7a6" opacity="0.46"/>
    <rect width="102" height="474" rx="24" fill="#111827" opacity="0.74"/>
    <rect x="102" width="288" height="474" rx="24" fill="#0f172a" opacity="0.46"/>
    <circle cx="32" cy="34" r="10" fill="#d8b4fe"/>
