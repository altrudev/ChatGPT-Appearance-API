    <text x="126" y="42" fill="#f3e8ff" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">REFERENCE CLIENT</text>
    <rect x="136" y="96" width="190" height="46" rx="15" fill="#111827" opacity="0.56"/>
    <rect x="157" y="111" width="146" height="7" rx="3.5" fill="#f8fafc" opacity="0.78"/>
    <rect x="157" y="125" width="88" height="7" rx="3.5" fill="#f8fafc" opacity="0.5"/>
    <rect x="126" y="174" width="218" height="112" rx="16" fill="#0f172a" opacity="0.62" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="146" y="194" width="167" height="7" rx="3.5" fill="#f8fafc" opacity="0.86"/>
    <rect x="146" y="210" width="180" height="7" rx="3.5" fill="#f8fafc" opacity="0.56"/>
    <rect x="146" y="226" width="154" height="7" rx="3.5" fill="#f8fafc" opacity="0.56"/>
    <rect x="146" y="242" width="122" height="7" rx="3.5" fill="#f8fafc" opacity="0.56"/>
    <rect x="126" y="397" width="232" height="46" rx="18" fill="#0f172a" opacity="0.64" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="195" y="425" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Message…</text>
    <rect x="16" y="418" width="70" height="25" rx="12.5" fill="#111827" opacity="0.7"/>
    <text x="26" y="435" fill="#e9d5ff" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="650">LOCAL ONLY</text>
  </g>

  <g transform="translate(980 214)">
    <rect width="388" height="474" rx="24" fill="#111827" stroke="#273449"/>
    <text x="28" y="42" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700">NATIVE APPEARANCE API</text>
    <text x="28" y="70" fill="#91a0b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Host-controlled capability request</text>

    <rect x="28" y="98" width="332" height="62" rx="16" fill="#182235"/>
    <circle cx="54" cy="129" r="13" fill="#38bdf8" opacity="0.2"/>
    <path d="M48 129l4 4 8-9" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="124" fill="#e5edf7" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">background.image</text>
    <text x="78" y="143" fill="#8391a7" font-family="Inter, ui-sans-serif, system-ui" font-size="11">Opaque local asset handle</text>

    <rect x="28" y="174" width="332" height="62" rx="16" fill="#182235"/>
    <circle cx="54" cy="205" r="13" fill="#c084fc" opacity="0.2"/>
    <path d="M48 205l4 4 8-9" fill="none" stroke="#d8b4fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="200" fill="#e5edf7" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">surface.conversation.opacity</text>
    <text x="78" y="219" fill="#8391a7" font-family="Inter, ui-sans-serif, system-ui" font-size="11">Clamped by host policy</text>

    <rect x="28" y="250" width="332" height="62" rx="16" fill="#182235"/>
    <circle cx="54" cy="281" r="13" fill="#34d399" opacity="0.2"/>
    <path d="M48 281l4 4 8-9" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="276" fill="#e5edf7" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">surface.glass.blur</text>
    <text x="78" y="295" fill="#8391a7" font-family="Inter, ui-sans-serif, system-ui" font-size="11">Rendered by host</text>

    <rect x="28" y="334" width="332" height="86" rx="16" fill="#0d1422" stroke="#273449"/>
    <text x="48" y="360" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="700">PRESERVED INVARIANTS</text>
    <text x="48" y="383" fill="#9eabc0" font-family="Inter, ui-sans-serif, system-ui" font-size="11">No conversation access  •  No auth UI control</text>
    <text x="48" y="403" fill="#9eabc0" font-family="Inter, ui-sans-serif, system-ui" font-size="11">No executable theme code  •  Rollback available</text>

    <text x="28" y="451" fill="#718096" font-family="Inter, ui-sans-serif, system-ui" font-size="10">Illustrative reference UI — not an official OpenAI interface.</text>
  </g>

  <text x="72" y="758" fill="#7dd3fc" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">APPEARANCE</text>
  <text x="185" y="758" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="15">≠</text>
  <text x="215" y="758" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui" font-size="15">CONTENT</text>
  <text x="310" y="758" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="15">≠</text>
  <text x="340" y="758" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui" font-size="15">FUNCTION</text>
  <text x="448" y="758" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="15">≠</text>
  <text x="478" y="758" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui" font-size="15">AUTHENTICATION</text>
  <text x="625" y="758" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="15">≠</text>
  <text x="655" y="758" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui" font-size="15">EXECUTION</text>
</svg>
