<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Safe Appearance Layer permission boundary</title>
  <desc id="desc">Diagram showing a theme provider submitting declarative appearance values to a host validator, while conversation, authentication, functional controls, and execution remain outside the provider's authority.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="580" rx="28" fill="#0a0f16"/>
  <text x="54" y="64" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="30" font-weight="750">Permission boundary</text>
  <text x="54" y="96" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="16">The provider asks. The host decides, renders, verifies, and can reverse.</text>

  <g transform="translate(54 150)">
    <rect width="270" height="300" rx="22" fill="url(#panel)" stroke="#334155"/>
    <text x="28" y="42" fill="#d8b4fe" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">THEME / PROVIDER</text>
    <text x="28" y="78" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Can request</text>
    <text x="28" y="108" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• background.image</text>
    <text x="28" y="132" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• background.gradient</text>
    <text x="28" y="156" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• surface opacity</text>
    <text x="28" y="180" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• host-defined blur</text>
    <rect x="28" y="216" width="214" height="52" rx="14" fill="#241836" stroke="#4c2f69"/>
    <text x="46" y="247" fill="#e9d5ff" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">No DOM or arbitrary CSS</text>
  </g>

  <line x1="342" y1="300" x2="462" y2="300" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="358" y="282" fill="#7dd3fc" font-family="Inter, ui-sans-serif, system-ui" font-size="11">declarative request</text>

  <g transform="translate(480 150)">
    <rect width="260" height="300" rx="22" fill="#101827" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="28" y="42" fill="#7dd3fc" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">HOST POLICY</text>
    <text x="28" y="78" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Validates</text>
    <text x="28" y="108" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• granted capabilities</text>
    <text x="28" y="132" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• local asset policy</text>
    <text x="28" y="156" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• accessibility bounds</text>
    <text x="28" y="180" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• unknown fields fail closed</text>
    <rect x="28" y="216" width="204" height="52" rx="14" fill="#0f2a2a" stroke="#1f4f49"/>
    <text x="52" y="247" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">Renderer + rollback</text>
  </g>

  <line x1="758" y1="300" x2="860" y2="300" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="773" y="282" fill="#7dd3fc" font-family="Inter, ui-sans-serif, system-ui" font-size="11">approved values</text>

  <g transform="translate(876 150)">
    <rect width="270" height="300" rx="22" fill="url(#panel)" stroke="#334155"/>
    <text x="28" y="42" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">HOST UI</text>
    <text x="28" y="78" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Preserves</text>
    <text x="28" y="108" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• conversation confidentiality</text>
    <text x="28" y="132" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• authentication integrity</text>
    <text x="28" y="156" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• functional controls</text>
    <text x="28" y="180" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">• execution boundary</text>
    <rect x="28" y="216" width="214" height="52" rx="14" fill="#0e2632" stroke="#1d5368"/>
    <text x="63" y="247" fill="#bae6fd" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">Appearance only</text>
  </g>

  <rect x="54" y="492" width="1092" height="44" rx="14" fill="#0f172a" stroke="#263449"/>
  <text x="86" y="520" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">User Authority → Appearance Intent → Capability Check → Host Render → Verification → Evidence → Reversal</text>
</svg>
